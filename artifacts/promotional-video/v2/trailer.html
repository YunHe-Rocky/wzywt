<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>王者演武堂 · 预告片样片</title>
<style>html,body{margin:0;background:#03070b;overflow:hidden}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style>
<canvas id="film" width="1920" height="1080"></canvas>
<script>
const canvas=document.getElementById('film'),c=canvas.getContext('2d',{alpha:false});
const W=1920,H=1080,Y=132,CH=816;
const clamp=x=>Math.max(0,Math.min(1,x));
const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
const ramp=(t,a,b)=>ease((t-a)/(b-a));
const fade=(t,a,b,d=.35)=>ramp(t,a,a+d)*(1-ramp(t,b-d,b));
let seed=517;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
const dust=Array.from({length:160},()=>({x:rand()*W,y:rand()*H,z:rand(),v:rand(),p:rand()*7}));
const glow=document.createElement('canvas');glow.width=glow.height=256;
{const q=glow.getContext('2d'),g=q.createRadialGradient(128,128,0,128,128,128);g.addColorStop(0,'rgba(160,196,213,.26)');g.addColorStop(.35,'rgba(110,145,165,.11)');g.addColorStop(1,'rgba(90,140,160,0)');q.fillStyle=g;q.fillRect(0,0,256,256)}
const grain=document.createElement('canvas');grain.width=grain.height=192;
{const q=grain.getContext('2d'),d=q.createImageData(192,192);for(let i=0;i<d.data.length;i+=4){d.data[i]=d.data[i+1]=d.data[i+2]=rand()*255;d.data[i+3]=22}q.putImageData(d,0,0)}
const imgs={};
async function getImage(key,url,optional=false){return new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>{imgs[key]=i;resolve()};i.onerror=()=>optional?resolve():reject(new Error(url));i.src=url})}
window.ready=Promise.all([getImage('canyon','canyon-keyframe.png'),getImage('sword','sword-keyframe.png',true)]).then(()=>{window.render(0);return true});
function cover(img,scale=1,dx=0,dy=0){if(!img)return;const s=Math.max(W/img.width,CH/img.height)*scale;const w=img.width*s,h=img.height*s;c.drawImage(img,(W-w)/2+dx,Y+(CH-h)/2+dy,w,h)}
function shade(a=.55){const g=c.createLinearGradient(0,Y,0,H-Y);g.addColorStop(0,`rgba(1,7,12,${a*.9})`);g.addColorStop(.4,'rgba(1,7,12,0)');g.addColorStop(1,`rgba(1,7,12,${a})`);c.fillStyle=g;c.fillRect(0,Y,W,CH)}
function vignette(a=.62){const g=c.createRadialGradient(960,510,200,960,510,1120);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,3,7,${a})`);c.fillStyle=g;c.fillRect(0,Y,W,CH)}
function haze(t,strength=1){c.save();c.globalCompositeOperation='screen';c.globalAlpha=.5*strength;for(let i=0;i<9;i++){let x=((i*387+t*(i%2?17:-12)+2900)%2700)-650;let y=560+Math.sin(i*1.3+t*.15)*110;c.drawImage(glow,x,y,1000+180*Math.sin(i),310+60*Math.cos(i));}c.restore()}
function sparks(t,a=1,fast=false){c.save();c.globalCompositeOperation='screen';for(const p of dust){const v=(fast?140:25)*(p.z+.2);const x=(p.x+t*v+W*2)%W,y=(p.y-t*v*.6+H*3)%H;if(y<Y||y>H-Y)continue;const sz=.65+p.z*2.8;c.globalAlpha=a*(.16+.57*p.z)*(.65+.35*Math.sin(t*2+p.p));c.fillStyle=p.x<W/2?'#6ec9f0':'#ffbc68';c.shadowBlur=6+9*p.z;c.shadowColor=c.fillStyle;c.beginPath();c.ellipse(x,y,sz*(fast?2.2:1),sz*.6,-.4,0,Math.PI*2);c.fill()}c.restore()}
function flare(t,cx,cy,color,amount){if(amount<=0)return;c.save();c.globalCompositeOperation='screen';c.globalAlpha=amount;const g=c.createRadialGradient(cx,cy,0,cx,cy,460);g.addColorStop(0,color);g.addColorStop(.08,color.replace(/[^,]+\)$/,'0.18)'));g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(cx-460,cy-460,920,920);c.restore()}
function tracked(text,x,y,size,spacing,color='#e9e6df',font='Microsoft YaHei',align='center') {c.font=`${size}px "${font}"`;const widths=[...text].map(ch=>c.measureText(ch).width);let total=widths.reduce((a,b)=>a+b,0)+spacing*(widths.length-1);let sx=align==='center'?x-total/2:x;c.fillStyle=color;c.textBaseline='middle';[...text].forEach((ch,i)=>{c.fillText(ch,sx,y);sx+=widths[i]+spacing})}
function title(text,t,a,b,opts={}){const alpha=fade(t,a,b,.32);if(!alpha)return;const p=ramp(t,a,a+.8);c.save();c.globalAlpha=alpha;c.translate(opts.x??960,(opts.y??535)+(1-p)*20);c.scale(1+.035*(1-p),1+.035*(1-p));c.shadowBlur=22;c.shadowColor='#03080c';tracked(text,0,0,opts.size??130,opts.space??10,opts.color??'#f1ede2',opts.font??'STXingkai');c.restore()}
function slash(t,start,color){let p=clamp((t-start)/.36);if(p<=0||p>=1)return;c.save();c.globalCompositeOperation='screen';c.globalAlpha=Math.sin(p*Math.PI)*.75;c.strokeStyle=color;c.shadowColor=color;c.shadowBlur=28;c.lineWidth=1+9*Math.sin(p*Math.PI);c.beginPath();c.moveTo(-W*.4+p*W*1.5,H-Y);c.lineTo(W*.1+p*W*1.5,Y);c.stroke();c.restore()}
function crest(x,y,s,a){c.save();c.translate(x,y);c.scale(s,s);c.globalAlpha=a;c.strokeStyle='#dfc494';c.lineWidth=2.2;c.lineJoin='miter';c.beginPath();c.moveTo(0,-36);c.lineTo(28,-19);c.lineTo(22,18);c.lineTo(0,36);c.lineTo(-22,18);c.lineTo(-28,-19);c.closePath();c.stroke();for(const yy of [-12,4]){c.beginPath();c.moveTo(-13,yy);c.lineTo(0,yy+13);c.lineTo(13,yy);c.stroke()}c.restore()}
window.render=function(t){
 c.globalAlpha=1;c.globalCompositeOperation='source-over';c.fillStyle='#02060a';c.fillRect(0,0,W,H);c.save();c.beginPath();c.rect(0,Y,W,CH);c.clip();
 if(t<4.5){let p=clamp(t/4.5);cover(imgs.canyon,1.06+p*.12,24-p*55,20-p*18);shade(.55);haze(t,1);sparks(t,.6);vignette(.56);title('人齐了。',t,1.55,4.3,{y:550,size:136});}
 else if(t<7.45){let p=(t-4.5)/2.95;cover(imgs.sword||imgs.canyon,1.10+p*.055,-90+145*p,12-p*18);shade(.28);haze(t,.45);sparks(t,.9,true);vignette(.4);title('曾经并肩',t,4.9,7.2,{x:530,y:490,size:107});}
 else if(t<10.7){let p=(t-7.45)/3.25;cover(imgs.canyon,1.30-p*.18,-28+35*p,-16);shade(.42);haze(t,1.5);sparks(t,1,true);vignette(.5);title('今夜，做对手。',t,7.7,10.55,{size:140,y:525});slash(t,7.45,'#f9ca85');}
 else if(t<15.65){cover(imgs.canyon,1.15,0,0);shade(.8);/* Actual recorded video is composited into this shot during final encoding. */}
 else {let p=(t-15.65)/6.35;cover(imgs.canyon,1.07+.035*p,0,-8);c.fillStyle='rgba(1,7,13,.64)';c.fillRect(0,Y,W,CH);haze(t,.5);sparks(t,.55);vignette(.5);let a=ramp(t,15.7,16.25)*(1-ramp(t,21.5,22));crest(960,326,1,a);c.save();c.globalAlpha=a;tracked('王者演武堂',960,425,49,9,'#e8d2aa','Microsoft YaHei');tracked('今晚，峡谷见。',970,584,140,4,'#f4eddf','STXingkai');tracked('和朋友，好好打一场。',960,729,28,5,'#c8cbd0');tracked('ywt.yunhe.ink',960,808,25,4,'#d4b87f','Arial');c.restore();}
 if(t<.75){c.fillStyle=`rgba(0,4,8,${1-ramp(t,.15,.75)})`;c.fillRect(0,Y,W,CH)}
 if(t>21.35){c.fillStyle=`rgba(0,4,8,${ramp(t,21.35,22)})`;c.fillRect(0,Y,W,CH)}
 for(const cut of [4.5,7.45,10.7,15.65]){let d=t-cut;if(d>=0&&d<.08){c.fillStyle=`rgba(214,229,237,${.20*(1-d/.08)})`;c.fillRect(0,Y,W,CH)}}
 c.save();c.globalCompositeOperation='soft-light';c.globalAlpha=.30;c.fillStyle=c.createPattern(grain,'repeat');c.translate(Math.floor(t*30)%7*17,Math.floor(t*30)%9*13);c.fillRect(-200,-200,2200,1400);c.restore();c.restore();
 c.fillStyle='#020509';c.fillRect(0,0,W,Y);c.fillRect(0,H-Y,W,Y);
 if(t>=10.7&&t<15.65){c.globalAlpha=.9;tracked('好友集结 · 5V5 内战',960,1007,28,5,'#dbc596');tracked('真实网站画面',1670,89,17,2,'#b4bec9');c.globalAlpha=1;}
 if(t>15.8&&t<21.4){c.globalAlpha=.55;tracked('AI 宣传意象 · 非游戏实录',960,982,17,2,'#abb4bc');tracked('Music: Legionnaire — Scott Buckley · CC BY 4.0 · scottbuckley.com.au',960,1025,16,1,'#9cabb8','Arial');c.globalAlpha=1;}
 return true;
};
</script></html>
