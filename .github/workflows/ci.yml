name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-password
          MYSQL_DATABASE: yanwutang_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:ci-password@127.0.0.1:3306/yanwutang_ci
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: bash -n scripts/deploy.sh scripts/mysql-backup.sh
      - run: npm run check:architecture
      - run: npm run typecheck
      - run: npm run test:core
      - run: npm run test:markdown
      - run: npm run test:next-stage
      - run: npm run test:connections
      - run: npm run test:integration
      - run: npm run lint
      - run: npm run build
