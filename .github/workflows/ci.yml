name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
        mode: [proxy, local]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-password
          MYSQL_DATABASE: yanwutang_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:ci-password@127.0.0.1:3306/yanwutang_ci
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      ALLOW_INTEGRATION_TEST_DATABASE: "1"
      E2E_ALLOW_TEST_DATABASE: "1"
      PUBLIC_ORIGIN: https://localhost:8443
      MEDIA_STORAGE_DIR: /tmp/wzywt-ci-media
      AVATAR_DIR: /tmp/wzywt-ci-avatars

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: bash -n scripts/*.sh
      - name: Shared local and CI verification collection
        run: npm run check
      - run: npm run test:integration
      - run: npm run test:integration:audit
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Complete video streaming through the Next entry
        run: npm run test:e2e:combat-streaming
      - name: Tournament error and split status regression (desktop and 320px mobile)
        env:
          DEPLOY_ENVIRONMENT: local
          PUBLIC_ORIGIN: http://localhost:8001
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 8001 > /tmp/wzywt-boundaries.log 2>&1 &
          boundary_pid=$!
          trap 'kill "$boundary_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8001/robots.txt > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e:tournament-boundaries
      - name: History theme session preview regression
        run: npm run test:e2e:history-theme
      - name: Combat feed and admin browser regression
        run: npm run test:e2e:combat-admin
      - name: Install isolated HTTPS proxy dependency
        run: sudo apt-get update && sudo apt-get install -y nginx openssl
      - name: Browser regression in isolated deployment mode
        run: npm run test:e2e:${{ matrix.mode }}
      - name: Upload sanitized browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-${{ matrix.node }}-${{ matrix.mode }}
          path: .cache/ci-diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  containers:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      DEPLOY_ENVIRONMENT: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Generate isolated container configuration
        run: |
          node scripts/compose.mjs init
          node -e "const fs=require('node:fs');const p='.env.docker';fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace(/^APP_RELEASE_ID=.*$/m,'APP_RELEASE_ID=ci-'+process.env.GITHUB_SHA))"
      - name: Validate Compose including optional OCR and OSS storage
        run: node scripts/test-compose-model.mjs
      - name: Build, back up, migrate and verify desktop/mobile entry
        run: node scripts/compose.mjs up
      - name: Verify newly downloaded shared images without restarting Web
        run: |
          cron_id=$(docker ps --filter label=com.docker.compose.project=wzywt --filter label=com.docker.compose.service=cron --format '{{.ID}}')
          test -n "$cron_id"
          docker exec "$cron_id" node -e "require('node:fs').writeFileSync('/app/public/heroes/images/2147483646.jpg',Buffer.from([255,216,255,217]))"
          node --input-type=module -e "import assert from 'node:assert/strict';for(const ua of ['Mozilla/5.0 Windows','Mozilla/5.0 iPhone Mobile']){const r=await fetch('http://localhost:8001/heroes/images/2147483646.jpg',{redirect:'manual',headers:{'User-Agent':ua}});assert.equal(r.status,200);assert.equal((await r.arrayBuffer()).byteLength,4)}"
      - name: Container diagnostics
        if: failure()
        run: |
          mkdir -p .cache/ci-diagnostics/containers
          node scripts/compose.mjs status
          for container_id in $(docker ps --all --filter label=com.docker.compose.project=wzywt --format '{{.ID}}'); do
            docker inspect --format '{{json .State}}' "$container_id" > ".cache/ci-diagnostics/containers/$container_id-state.json"
            docker logs --tail 100 "$container_id"
          done
      - name: Upload container state and readiness diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: containers
          path: .cache/ci-diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop isolated stack
        if: always()
        run: |
          if [ -f .env.docker ]; then
            node scripts/compose.mjs down
          fi
  database-compatibility:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.0", "8.4"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: ci-password
          MYSQL_DATABASE: yanwutang_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:ci-password@127.0.0.1:3306/yanwutang_ci
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      ALLOW_INTEGRATION_TEST_DATABASE: "1"
      MEDIA_STORAGE_DIR: /tmp/wzywt-db-matrix-media
      AVATAR_DIR: /tmp/wzywt-db-matrix-avatars
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test:integration
      - run: npm run test:integration:audit

  ocr-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r services/ocr/requirements-test.txt
      - run: python -m unittest discover -s services/ocr -p 'test_*.py'
      - run: OCR_TEST_PYTHON=$(command -v python) node --import tsx scripts/test-ocr-contract.mjs

  redis-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      REDIS_URL: redis://127.0.0.1:6379/15
      ALLOW_REDIS_INTEGRATION_TEST: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:redis:audit
